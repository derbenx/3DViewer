<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLTF Viewer</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #c { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        #side-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 250px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            transition: transform 0.3s ease;
            transform: translateX(-250px); /* Start hidden */
            height: 100%;
            z-index: 2;
            padding: 20px;
            box-sizing: border-box;
        }

        #side-panel.visible {
            transform: translateX(0);
        }

        #panel-toggle-button {
            position: absolute;
            top: 10px;
            right: -40px; /* Position outside the panel */
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 20px;
            line-height: 30px;
            text-align: center;
            padding: 0;
        }

        #panel-content {
            display: flex;
            flex-direction: column;
            height: calc(100% - 30px); /* Reserve space for version info */
        }

        #file-input {
            width: 100%;
            margin-bottom: 15px;
        }

        #webxr-buttons {
            display: flex;
            flex-direction: row;
            gap: 10px; /* Add some space between the buttons */
        }

        #webxr-buttons button {
            position: static !important; /* Override library's inline absolute positioning */
            width: 100% !important;
            margin: 0 !important;
            display: block;
            background-color: #444;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
        }

        #webxr-buttons button:hover, #panel-content button:hover {
            background-color: #555;
            box-shadow: 0 0 8px 2px rgba(80, 200, 80, 0.5);
        }

        #sample-models-list {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
            padding: 10px;
            margin-top: 5px;
        }

        #sample-models-list button {
            background-color: #555;
            border: 1px solid #666;
            color: white;
            padding: 8px 12px;
            margin-bottom: 5px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            display: block;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .collapsible-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none; /* Prevent text selection on click */
        }

        .collapsible-header::after {
            content: '−'; /* Minus sign for expanded */
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .collapsible-container.collapsed .collapsible-header::after {
            content: '+'; /* Plus sign for collapsed */
        }

        .collapsible-content {
            padding-left: 10px;
            border-left: 2px solid #555;
            margin-left: 5px;
            margin-top: 10px;
        }

        .collapsible-container.collapsed .collapsible-content {
            display: none;
        }

        #main-controls-container {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding-right: 15px; /* Prevent content from hiding under scrollbar */
        }

        #side-panel * {
            box-sizing: border-box;
        }

        #main-controls-container hr {
            width: 100%;
            border: none;
            border-top: 1px solid #555;
            margin: 15px 0;
        }

        .custom-select-container {
            position: relative;
            user-select: none;
        }

        .custom-select-value {
            background-color: #444;
            color: white;
            border: 1px solid #555;
            padding: 5px 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .custom-select-value::after {
            content: '▼';
            font-size: 10px;
        }

        .custom-select-options {
            display: none;
            position: absolute;
            background-color: #333;
            border: 1px solid #555;
            width: 100%;
            z-index: 10;
            max-height: 150px;
            overflow-y: auto;
        }

        .custom-select-options.visible {
            display: block;
        }

        .custom-select-option {
            padding: 8px 10px;
            cursor: pointer;
        }

        .custom-select-option:hover {
            background-color: #555;
        }

        .custom-select-option.selected {
            background-color: #666;
        }
    </style>
</head>
<body>
    <div id="side-panel" class="visible">
        <button id="panel-toggle-button">☰</button>
        <div id="panel-content">
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button id="browse-button" style="flex-grow: 1; padding: 10px; background-color: #444; color: white; border: 1px solid #555; cursor: pointer; font-size: 14px;">360 or Model</button>
                <button id="browse-image-button" style="flex-grow: 1; padding: 10px; background-color: #444; color: white; border: 1px solid #555; cursor: pointer; font-size: 14px;">Flat Image</button>
                <button id="clear-button" style="padding: 10px; background-color: #666; color: white; border: 1px solid #777; cursor: pointer; font-size: 14px;">Clear</button>
            </div>
            <!-- <input type="file" id="file-input-fallback" accept=".gltf,.glb,.fbx,.obj,.stl,.jpg,.jpeg,.png" style="display: none;" /> -->
            <!-- <input type="file" id="image-input-fallback" accept=".jpg,.jpeg,.png" style="display: none;" /> -->
            <div id="webxr-buttons"></div>
            <div id="main-controls-container">
                <hr>
                <div class="collapsible-container">
                    <h4 class="collapsible-header">Settings</h4>
                    <div class="collapsible-content">
                        <div>
                            <input type="checkbox" id="antialias-toggle">
                            <label for="antialias-toggle" style="font-size: 14px;">Enable Antialiasing</label>
                        </div>
                        <div>
                            <input type="checkbox" id="fps-toggle">
                            <label for="fps-toggle" style="font-size: 14px;">Show FPS</label>
                        </div>
                        <div>
                            <input type="checkbox" id="three-point-lighting-toggle">
                            <label for="three-point-lighting-toggle" style="font-size: 14px;">Enable 3-Point Lighting</label>
                        </div>
                        <div id="three-point-light-controls" style="display: none;">
                             <div style="display: flex; align-items: center; gap: 10px;">
                                <label for="three-point-light-slider" style="font-size: 14px;">Light</label>
                                <input type="range" id="three-point-light-slider" min="50" max="500" step="10" value="100" style="flex-grow: 1;">
                            </div>
                        </div>
                        <div id="single-light-controls">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <label for="light-slider" style="font-size: 14px;">Light</label>
                                <input type="range" id="light-slider" min="50" max="500" step="10" value="100" style="flex-grow: 1;">
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
                                <label style="font-size: 14px;">Type</label>
                                <div id="light-type-select" class="custom-select-container" style="flex-grow: 1;">
                                    <div class="custom-select-value"></div>
                                    <div class="custom-select-options">
                                        <div class="custom-select-option" data-value="Directional">Directional</div>
                                        <div class="custom-select-option" data-value="Point">Point</div>
                                        <div class="custom-select-option" data-value="Spot">Spot</div>
                                        <div class="custom-select-option" data-value="Ambient">Ambient</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label style="font-size: 14px;">VR Background</label>
                            <div id="rgb-sliders" style="display: flex; flex-direction: column; gap: 5px; margin-top: 5px;">
                                <div style="display: flex; align-items: center; gap: 5px;"><label for="r-slider" style="width: 20px;">R:</label><input type="range" id="r-slider" min="0" max="255" step="1" style="flex-grow: 1;"></div>
                                <div style="display: flex; align-items: center; gap: 5px;"><label for="g-slider" style="width: 20px;">G:</label><input type="range" id="g-slider" min="0" max="255" step="1" style="flex-grow: 1;"></div>
                                <div style="display: flex; align-items: center; gap: 5px;"><label for="b-slider" style="width: 20px;">B:</label><input type="range" id="b-slider" min="0" max="255" step="1" style="flex-grow: 1;"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="collapsible-container collapsed">
                    <h4 class="collapsible-header">Help</h4>
                    <div class="collapsible-content">
                        <ul style="padding-left: 20px; font-size: 14px; margin-top: 0;">
                            <li><b>Trigger + Grip:</b> Scale Model</li>
                            <li><b>Trigger:</b> Move Model Up/Down</li>
                            <li><b>Grip:</b> Rotate Model</li>
                            <li><b>Thumbstick:</b> Move Model on Floor</li>
                            <li><b>A/X Button:</b> Exit VR/AR</li>
                        </ul>
                    </div>
                </div>
                <hr>
                <div class="collapsible-container">
                    <h4 id="sample-models-header" class="collapsible-header">Sample Models</h4>
                    <div class="collapsible-content">
                        <div id="sample-models-list"></div>
                    </div>
                </div>
                <hr>
            </div>
            <!-- AGENT_NOTE: Always update this version number when changing files. -->
            <div id="version-info" style="font-size: 12px; color: #888; position: absolute; bottom: 10px;">Version: 2.6.2</div>
        </div>
    </div>
    <div id="fps-counter" style="position: absolute; top: 10px; right: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px; font-family: sans-serif; display: none; z-index: 10;"></div>
    <canvas id="c"></canvas>
    <script type="importmap">
        {
            "imports": {
                "three": "./js/three/build/three.module.js",
                "three/addons/": "./js/three/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';

        function main() {
            let mixer;
            // --- Settings ---
            const settings = {
                antialias: JSON.parse(localStorage.getItem('settings.antialias')) ?? true,
                showFPS: JSON.parse(localStorage.getItem('settings.showFPS')) ?? false,
                vrBackgroundColor: localStorage.getItem('settings.vrBackgroundColor') ?? '#444444',
                lightIntensity: JSON.parse(localStorage.getItem('settings.lightIntensity')) ?? 1.0,
                lightType: localStorage.getItem('settings.lightType') ?? 'Directional',
                threePointLighting: JSON.parse(localStorage.getItem('settings.threePointLighting')) ?? false,
                threePointLightIntensity: JSON.parse(localStorage.getItem('settings.threePointLightIntensity')) ?? 1.0
            };

            const antialiasToggle = document.getElementById('antialias-toggle');
            antialiasToggle.checked = settings.antialias;
            antialiasToggle.addEventListener('change', (event) => {
                localStorage.setItem('settings.antialias', event.target.checked);
                location.reload();
            });

            const fpsToggle = document.getElementById('fps-toggle');
            fpsToggle.checked = settings.showFPS;
            fpsToggle.addEventListener('change', (event) => {
                localStorage.setItem('settings.showFPS', event.target.checked);
                location.reload();
            });

            const rSlider = document.getElementById('r-slider');
            const gSlider = document.getElementById('g-slider');
            const bSlider = document.getElementById('b-slider');

            const initialColor = new THREE.Color(settings.vrBackgroundColor);
            rSlider.value = Math.round(initialColor.r * 255);
            gSlider.value = Math.round(initialColor.g * 255);
            bSlider.value = Math.round(initialColor.b * 255);

            function updateColorFromSliders() {
                const r = parseInt(rSlider.value);
                const g = parseInt(gSlider.value);
                const b = parseInt(bSlider.value);
                const color = new THREE.Color(`rgb(${r}, ${g}, ${b})`);
                localStorage.setItem('settings.vrBackgroundColor', color.getStyle());
                currentBackground = color;
                scene.background = currentBackground;
            }

            rSlider.addEventListener('input', updateColorFromSliders);
            gSlider.addEventListener('input', updateColorFromSliders);
            bSlider.addEventListener('input', updateColorFromSliders);

            const lightSlider = document.getElementById('light-slider');
            lightSlider.value = settings.lightIntensity * 100;
            lightSlider.addEventListener('input', (event) => {
                const newIntensity = parseFloat(event.target.value) / 100;
                settings.lightIntensity = newIntensity;
                localStorage.setItem('settings.lightIntensity', newIntensity);
                updateLightSource();
            });

            const threePointLightSlider = document.getElementById('three-point-light-slider');
            threePointLightSlider.value = settings.threePointLightIntensity * 100;
            threePointLightSlider.addEventListener('input', (event) => {
                const newIntensity = parseFloat(event.target.value) / 100;
                settings.threePointLightIntensity = newIntensity;
                localStorage.setItem('settings.threePointLightIntensity', newIntensity);
                updateLightSource();
            });

            const threePointToggle = document.getElementById('three-point-lighting-toggle');
            threePointToggle.checked = settings.threePointLighting;
            threePointToggle.addEventListener('change', (event) => {
                settings.threePointLighting = event.target.checked;
                localStorage.setItem('settings.threePointLighting', event.target.checked);
                toggleLightControls();
                updateLightSource();
            });

            function toggleLightControls() {
                const singleLightControls = document.getElementById('single-light-controls');
                const threePointLightControls = document.getElementById('three-point-light-controls');
                if (settings.threePointLighting) {
                    singleLightControls.style.display = 'none';
                    threePointLightControls.style.display = 'block';
                } else {
                    singleLightControls.style.display = 'block';
                    threePointLightControls.style.display = 'none';
                }
            }
            toggleLightControls(); // Set initial state

            // --- Custom Select Dropdown Logic ---
            const lightTypeSelect = document.getElementById('light-type-select');
            const lightTypeValue = lightTypeSelect.querySelector('.custom-select-value');
            const lightTypeOptions = lightTypeSelect.querySelector('.custom-select-options');

            function updateSelectVisuals(selectedValue) {
                lightTypeValue.textContent = selectedValue;
                lightTypeOptions.querySelectorAll('.custom-select-option').forEach(opt => {
                    opt.classList.toggle('selected', opt.dataset.value === selectedValue);
                });
            }

            updateSelectVisuals(settings.lightType);

            lightTypeValue.addEventListener('click', (e) => {
                e.stopPropagation();
                lightTypeOptions.classList.toggle('visible');
            });

            lightTypeOptions.querySelectorAll('.custom-select-option').forEach(option => {
                option.addEventListener('click', () => {
                    const newType = option.dataset.value;
                    settings.lightType = newType;
                    localStorage.setItem('settings.lightType', newType);

                    updateSelectVisuals(newType);
                    lightTypeOptions.classList.remove('visible');
                    updateLightSource();
                });
            });

            // Close dropdown when clicking outside
            window.addEventListener('click', () => {
                if (lightTypeOptions.classList.contains('visible')) {
                    lightTypeOptions.classList.remove('visible');
                }
            });

            const clearButton = document.getElementById('clear-button');
            clearButton.addEventListener('click', () => {
                location.reload();
            });
            // --- End Settings ---

            let currentBackground = new THREE.Color(settings.vrBackgroundColor);

            const panel = document.getElementById('side-panel');
            const toggleButton = document.getElementById('panel-toggle-button');

            toggleButton.addEventListener('click', () => {
                panel.classList.toggle('visible');
            });

            const canvas = document.querySelector('#c');
            const renderer = new THREE.WebGLRenderer({canvas, antialias: settings.antialias, alpha: true});
            renderer.xr.enabled = true;

            // Set a reference space type that is compatible with most AR devices.
            renderer.xr.setReferenceSpaceType('local');

            const webxrButtonsContainer = document.getElementById('webxr-buttons');
            webxrButtonsContainer.appendChild(VRButton.createButton(renderer));
            webxrButtonsContainer.appendChild(ARButton.createButton(renderer));

            let originalModelInfo = null;
            renderer.xr.addEventListener('sessionstart', async () => {
                const session = renderer.xr.getSession();
                console.log('XR session started. Mode:', session.environmentBlendMode);

                if (session.environmentBlendMode === 'additive' || session.environmentBlendMode === 'alpha-blend') {
                    scene.background = null;
                } else {
                    scene.background = currentBackground;
                }

                const model = scene.getObjectByName('user_model');
                if (model) {
                    // Store original scale and position
                    originalModelInfo = {
                        scale: model.scale.clone(),
                        position: model.position.clone()
                    };

                    // Calculate bounding box and size
                    const box = new THREE.Box3().setFromObject(model);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);

                    // Avoid division by zero or tiny numbers if model has no size
                    if (maxDim > 0.001) {
                        // Target size for VR (e.g., 1.5 meters on its longest side)
                        const targetSize = 1.5;
                        const scaleFactor = targetSize / maxDim;
                        model.scale.set(scaleFactor, scaleFactor, scaleFactor);
                    }

                    // After scaling, get the new bounding box and center
                    const vrBox = new THREE.Box3().setFromObject(model);
                    const vrCenter = vrBox.getCenter(new THREE.Vector3());

                    // Reposition the model to be centered, on the floor, and in front of the user
                    model.position.x -= vrCenter.x;
                    model.position.y -= vrBox.min.y;
                    model.position.z -= vrCenter.z + 2;
                }
            });

            renderer.xr.addEventListener('sessionend', () => {
                console.log('XR session ended.');
                scene.background = currentBackground;
                const model = scene.getObjectByName('user_model');
                if (model && originalModelInfo) {
                    model.scale.copy(originalModelInfo.scale);
                    model.position.copy(originalModelInfo.position);
                    originalModelInfo = null; // Clear it for the next session

                    // Re-frame the camera for the 2D view
                    const box = new THREE.Box3().setFromObject(model);
                    const boxSize = box.getSize(new THREE.Vector3()).length();
                    const boxCenter = box.getCenter(new THREE.Vector3());
                    frameArea(boxSize * 1.2, boxSize, boxCenter, camera);
                    controls.target.copy(boxCenter);
                    controls.update();
                }

                // Reset camera rig position
                const cameraRig = renderer.xr.getCamera(camera);
                cameraRig.position.set(0, 0, 0);
            });

            const fov = 45;
            const aspect = 2;  // the canvas default
            const near = 0.1;
            const far = 100;
            const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
            camera.position.set(0, 1, 5);

            const controls = new OrbitControls(camera, canvas);
            controls.target.set(0, 1, 0);
            controls.update();

            const scene = new THREE.Scene();

            // VR Controllers Setup
            const controller1 = renderer.xr.getController(0);
            scene.add(controller1);
            const controller2 = renderer.xr.getController(1);
            scene.add(controller2);

            const controllerModelFactory = new XRControllerModelFactory();

            const controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
            scene.add(controllerGrip1);

            const controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
            scene.add(controllerGrip2);

            let gripPressed = [false, false];
            let triggerPressed = [false, false];
            let exitButtonPressed = [false, false];

            controller1.addEventListener('connected', function ( event ) {
                console.log('Controller 0 Connected.');
                this.gamepad = event.data.gamepad;
            } );
            controller1.addEventListener('selectstart', () => { triggerPressed[0] = true; });
            controller1.addEventListener('selectend', () => { triggerPressed[0] = false; });
            controller1.addEventListener('squeezestart', () => { gripPressed[0] = true; });
            controller1.addEventListener('squeezeend', () => { gripPressed[0] = false; });

            controller2.addEventListener('connected', function ( event ) {
                console.log('Controller 1 Connected.');
                this.gamepad = event.data.gamepad;
            } );
            controller2.addEventListener('selectstart', () => { triggerPressed[1] = true; });
            controller2.addEventListener('selectend', () => { triggerPressed[1] = false; });
            controller2.addEventListener('squeezestart', () => { gripPressed[1] = true; });
            controller2.addEventListener('squeezeend', () => { gripPressed[1] = false; });
            scene.background = currentBackground;

            {
                const skyColor = 0xB1E1FF;  // light blue
                const groundColor = 0xB97A20;  // brownish orange
                const intensity = 1;
                const light = new THREE.HemisphereLight(skyColor, groundColor, intensity);
                light.name = 'hemisphere_light';
                scene.add(light);
            }

            function updateLightForModel(modelBox) {
                const modelSize = modelBox.getSize(new THREE.Vector3()).length();
                const modelCenter = modelBox.getCenter(new THREE.Vector3());

                if (settings.threePointLighting) {
                    const keyLight = scene.getObjectByName('key_light');
                    const fillLight = scene.getObjectByName('fill_light');
                    const backLight = scene.getObjectByName('back_light');

                    if (keyLight) {
                        keyLight.position.copy(modelCenter).add(new THREE.Vector3(modelSize * 0.75, modelSize * 0.5, modelSize));
                        keyLight.target.position.copy(modelCenter);
                    }
                    if (fillLight) {
                        fillLight.position.copy(modelCenter).add(new THREE.Vector3(-modelSize * 0.75, modelSize * 0.5, modelSize));
                        fillLight.target.position.copy(modelCenter);
                    }
                    if (backLight) {
                        backLight.position.copy(modelCenter).add(new THREE.Vector3(0, modelSize, -modelSize));
                        backLight.target.position.copy(modelCenter);
                    }
                } else {
                    const mainLight = scene.getObjectByName('main_light');
                    if (!mainLight) return;

                    // Adjust light based on its type
                    if (mainLight.isDirectionalLight || mainLight.isSpotLight) {
                        mainLight.position.copy(modelCenter).add(new THREE.Vector3(modelSize * 0.5, modelSize, modelSize * 0.5));
                        mainLight.target.position.copy(modelCenter);
                    } else if (mainLight.isPointLight) {
                        mainLight.position.copy(modelCenter).add(new THREE.Vector3(0, modelSize * 0.75, modelSize * 0.75));
                    }

                    // For lights with a 'distance' property, update it based on model size
                    if (typeof mainLight.distance !== 'undefined') {
                        mainLight.distance = modelSize * 3;
                    }
                }
            }

            function clearLights() {
                const lightNames = ['main_light', 'key_light', 'fill_light', 'back_light'];
                lightNames.forEach(name => {
                    const light = scene.getObjectByName(name);
                    if (light) {
                        if (light.target) {
                            scene.remove(light.target);
                        }
                        scene.remove(light);
                    }
                });
            }

            function updateLightSource() {
                clearLights(); // Remove all existing lights first

                const color = 0xFFFFFF;

                if (settings.threePointLighting) {
                    const intensity = settings.threePointLightIntensity;
                    const keyLight = new THREE.DirectionalLight(color, intensity);
                    keyLight.name = 'key_light';
                    scene.add(keyLight);
                    scene.add(keyLight.target);

                    const fillLight = new THREE.DirectionalLight(color, intensity * 0.5);
                    fillLight.name = 'fill_light';
                    scene.add(fillLight);
                    scene.add(fillLight.target);

                    const backLight = new THREE.DirectionalLight(color, intensity * 0.75);
                    backLight.name = 'back_light';
                    scene.add(backLight);
                    scene.add(backLight.target);
                } else {
                    const intensity = settings.lightIntensity;
                    let light;

                    switch (settings.lightType) {
                        case 'Directional':
                            light = new THREE.DirectionalLight(color, intensity);
                            light.position.set(0, 10, 5);
                            light.target.position.set(-5, 0, 0);
                            scene.add(light.target);
                            break;
                        case 'Point':
                            light = new THREE.PointLight(color, intensity, 100); // distance = 100
                            light.position.set(0, 5, 5);
                            break;
                        case 'Spot':
                            light = new THREE.SpotLight(color, intensity, 100, Math.PI / 8, 0.5, 1); // distance, angle, penumbra, decay
                            light.position.set(0, 10, 5);
                            light.target.position.set(0, 0, 0);
                            scene.add(light.target);
                            break;
                        case 'Ambient':
                            // Ambient light is much stronger globally, so we scale its intensity down to be comparable.
                            light = new THREE.AmbientLight(color, intensity * 0.5);
                            break;
                    }
                    if (light) {
                        light.name = 'main_light';
                        scene.add(light);
                    }
                }

                // If a model exists, adjust the new light(s) for it
                const model = scene.getObjectByName('user_model');
                if (model) {
                    const modelBox = new THREE.Box3().setFromObject(model);
                    updateLightForModel(modelBox);
                }
            }

            updateLightSource(); // Initial light setup

            const gltfLoader = new GLTFLoader();
            const fbxLoader = new FBXLoader();
            const objLoader = new OBJLoader();
            const stlLoader = new STLLoader();
            const textureLoader = new THREE.TextureLoader();

            function loadResource(url, onLoadedCallback, originalFilename = null) {
                const filename = originalFilename || url.split('/').pop();
                const extension = filename.split('.').pop().toLowerCase();
                const imageExtensions = ['jpg', 'jpeg', 'png'];

                const onLoad = (result) => {
                    if (imageExtensions.includes(extension)) {
                        result.mapping = THREE.EquirectangularReflectionMapping;
                        scene.background = result;
                        scene.environment = result;
                        currentBackground = result; // Update current background
                    } else {
                        let object;
                        let animations = [];
                        if (result.scene) { // For GLTF
                            object = result.scene;
                            animations = result.animations;
                        } else if (result instanceof THREE.BufferGeometry) { // For STL
                            const material = new THREE.MeshStandardMaterial({color: 0xAAAAAA, metalness: 0.1, roughness: 0.75});
                            object = new THREE.Mesh(result, material);
                        } else { // For FBX, OBJ
                            object = result;
                            if (result.animations && result.animations.length > 0) {
                                animations = result.animations;
                            }
                        }
                        setModel(object, animations);
                    }
                    if (onLoadedCallback) onLoadedCallback();
                };

                const onError = (error) => {
                    console.error(`An error happened while loading ${url}:`, error);
                    alert(`Could not load resource: ${filename}. See console for details.`);
                    if (onLoadedCallback) onLoadedCallback();
                };

                if (imageExtensions.includes(extension)) {
                    textureLoader.load(url, onLoad, undefined, onError);
                    return;
                }

                let loader;
                switch (extension) {
                    case 'gltf':
                    case 'glb':
                        loader = gltfLoader;
                        break;
                    case 'fbx':
                        loader = fbxLoader;
                        break;
                    case 'obj':
                        loader = objLoader;
                        break;
                    case 'stl':
                        loader = stlLoader;
                        break;
                    default:
                        alert(`Unsupported file type: .${extension}`);
                        if (onLoadedCallback) onLoadedCallback();
                        return;
                }

                loader.load(url, onLoad, undefined, onError);
            }

            function setModel(object, animations = []) {
                if (mixer) {
                    mixer.stopAllAction();
                    mixer = null;
                }

                // The object could be a Group from GLTF/FBX/OBJ or a Mesh from STL

                // Ensure the model scales from the bottom
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                object.position.x -= center.x;
                object.position.y -= box.min.y;
                object.position.z -= center.z;

                const modelGroup = new THREE.Group();
                modelGroup.name = 'user_model';
                modelGroup.add(object);

                // remove previous model
                const previousModel = scene.getObjectByName('user_model');
                if (previousModel) {
                    scene.remove(previousModel);
                }
                scene.add(modelGroup);

                // center and frame the new model group
                const newBox = new THREE.Box3().setFromObject(modelGroup);
                const boxSize = newBox.getSize(new THREE.Vector3()).length();
                const boxCenter = newBox.getCenter(new THREE.Vector3());

                frameArea(boxSize * 1.2, boxSize, boxCenter, camera);

                controls.maxDistance = boxSize * 10;
                controls.target.copy(boxCenter);
                controls.update();

                updateLightForModel(newBox);

                if (animations && animations.length) {
                    mixer = new THREE.AnimationMixer(object);
                    const action = mixer.clipAction(animations[0]);
                    action.play();
                }
            }

            const browseButton = document.getElementById('browse-button');
            const fallbackInput = document.getElementById('file-input-fallback');

            async function handleFile(file) {
                const url = URL.createObjectURL(file);
                loadResource(url, () => URL.revokeObjectURL(url), file.name);
            }

            browseButton.addEventListener('click', async () => {
                if (window.showOpenFilePicker) {
                    try {
                        const pickerOpts = {
                            types: [
                                {
                                    description: '3D Models and Images',
                                    accept: {
                                        'model/gltf-binary': ['.glb'],
                                        'model/gltf+json': ['.gltf'],
                                        'model/x-fbx': ['.fbx'],
                                        'model/obj': ['.obj'],
                                        'model/stl': ['.stl'],
                                        'image/jpeg': ['.jpg', '.jpeg'],
                                        'image/png': ['.png'],
                                    }
                                },
                            ],
                            excludeAcceptAllOption: true,
                            multiple: false
                        };
                        const [fileHandle] = await window.showOpenFilePicker(pickerOpts);
                        const file = await fileHandle.getFile();
                        handleFile(file);
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            alert(`Error opening file: ${err.message}`);
                            console.error(err);
                        }
                    }
                } // else {
                //     fallbackInput.click();
                // }
            });

            // fallbackInput.addEventListener('change', (event) => {
            //     const file = event.target.files[0];
            //     if (file) {
            //         handleFile(file);
            //     }
            //     event.target.value = ''; // Reset fallback input
            // });

            const browseImageButton = document.getElementById('browse-image-button');
            const imageFallbackInput = document.getElementById('image-input-fallback');

            async function handleImageFile(file) {
                const url = URL.createObjectURL(file);
                textureLoader.load(url, (texture) => {
                    URL.revokeObjectURL(url); // Revoke URL after loading
                    const aspectRatio = texture.image.width / texture.image.height;
                    const imageHeight = 2; // Arbitrary height
                    const imageWidth = imageHeight * aspectRatio;
                    const geometry = new THREE.PlaneGeometry(imageWidth, imageHeight);
                    const material = new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
                    const mesh = new THREE.Mesh(geometry, material);
                    setModel(mesh);
                }, undefined, (error) => {
                    URL.revokeObjectURL(url);
                    console.error(`An error happened while loading ${file.name}:`, error);
                    alert(`Could not load image: ${file.name}. See console for details.`);
                });
            }

            browseImageButton.addEventListener('click', async () => {
                if (window.showOpenFilePicker) {
                    try {
                        const pickerOpts = {
                            types: [
                                {
                                    description: 'Images',
                                    accept: {
                                        'image/jpeg': ['.jpg', '.jpeg'],
                                        'image/png': ['.png'],
                                    }
                                },
                            ],
                            excludeAcceptAllOption: true,
                            multiple: false
                        };
                        const [fileHandle] = await window.showOpenFilePicker(pickerOpts);
                        const file = await fileHandle.getFile();
                        handleImageFile(file);
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            alert(`Error opening file: ${err.message}`);
                            console.error(err);
                        }
                    }
                } // else {
                //     imageFallbackInput.click();
                // }
            });

            // imageFallbackInput.addEventListener('change', (event) => {
            //     const file = event.target.files[0];
            //     if (file) {
            //         handleImageFile(file);
            //     }
            //     event.target.value = ''; // Reset fallback input
            // });

            const listContainer = document.getElementById('sample-models-list');
            listContainer.addEventListener('click', (event) => {
                if (event.target.tagName !== 'BUTTON') return;

                const modelPath = event.target.dataset.path;
                if (modelPath) {
                    loadResource(modelPath);
                }
            });

            function frameArea(sizeToFitOnScreen, boxSize, boxCenter, camera) {
              const halfSizeToFitOnScreen = sizeToFitOnScreen * 0.5;
              const halfFovY = THREE.MathUtils.degToRad(camera.fov * .5);
              const distance = halfSizeToFitOnScreen / Math.tan(halfFovY);

              const direction = (new THREE.Vector3())
                  .subVectors(camera.position, boxCenter)
                  .multiply(new THREE.Vector3(1, 0, 1))
                  .normalize();

              camera.position.copy(direction.multiplyScalar(distance).add(boxCenter));
              camera.near = 0.01;
              camera.far = boxSize * 10;
              camera.updateProjectionMatrix();
              camera.lookAt(boxCenter.x, boxCenter.y, boxCenter.z);
            }

            function resizeRendererToDisplaySize(renderer) {
                if (renderer.xr.isPresenting) return false; // Don't resize when in XR

                const canvas = renderer.domElement;
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                const needResize = canvas.width !== width || canvas.height !== height;
                if (needResize) {
                    renderer.setSize(width, height, false);
                }
                return needResize;
            }

            const clock = new THREE.Clock();
            const fpsCounter = {
                element: document.getElementById('fps-counter'),
                frames: 0,
                lastTime: performance.now()
            };

            if (settings.showFPS) {
                fpsCounter.element.style.display = 'block';
            }


            function handleControllerInput(timeDelta) {
                if (renderer.xr.isPresenting) {
                    for (let i = 0; i < 2; i++) {
                        const controller = renderer.xr.getController(i);

                        if (controller && controller.gamepad && controller.gamepad.axes.length >= 4) {
                            const model = scene.getObjectByName('user_model');
                            if (model) {
                                const x = controller.gamepad.axes[2];
                                const z = controller.gamepad.axes[3];
                                const deadzone = 0.25;

                                if (triggerPressed[i] && gripPressed[i]) {
                                    // Grip + Trigger: Scale
                                    const scaleSpeed = 0.5;
                                    if (Math.abs(z) > deadzone) {
                                        const scaleFactor = 1.0 - z * scaleSpeed * timeDelta;
                                        model.scale.multiplyScalar(scaleFactor);
                                    }
                                } else if (triggerPressed[i]) {
                                    // Trigger: Move Y
                                    const verticalSpeed = 1.0;
                                    if (Math.abs(z) > deadzone) {
                                        model.position.y -= z * verticalSpeed * timeDelta;
                                    }
                                } else if (gripPressed[i]) {
                                    // Grip: Rotate Y
                                    const rotationSpeed = 1.5; // radians per second
                                    if (Math.abs(x) > deadzone) {
                                        model.rotation.y -= x * rotationSpeed * timeDelta;
                                    }
                                } else {
                                    // No button: Translate X/Z on the floor (slower)
                                    const moveSpeed = 1.0; // meters per second
                                    if (Math.abs(x) > deadzone) {
                                        model.position.x += x * moveSpeed * timeDelta;
                                    }
                                    if (Math.abs(z) > deadzone) {
                                        model.position.z += z * moveSpeed * timeDelta;
                                    }
                                }
                            }

                            // Exit VR button is independent of other controls
                            if (controller.gamepad.buttons.length > 5 && controller.gamepad.buttons[5].pressed) {
                                if (!exitButtonPressed[i]) {
                                    exitButtonPressed[i] = true;
                                    // Find the currently active button (VR or AR) and click it
                                    // This ensures the same exit logic is used everywhere.
                                    const vrButton = document.getElementById('VRButton');
                                    const arButton = document.getElementById('ARButton');
                                    if (vrButton && vrButton.textContent.includes('EXIT')) {
                                        vrButton.click();
                                    } else if (arButton && arButton.textContent.includes('STOP')) {
                                        arButton.click();
                                    }
                                }
                            } else {
                                exitButtonPressed[i] = false;
                            }
                        }
                    }
                }
            }

            function render(time) {
                if (settings.showFPS) {
                    fpsCounter.frames++;
                    if (time >= fpsCounter.lastTime + 1000) {
                        fpsCounter.element.textContent = `${fpsCounter.frames} FPS`;
                        fpsCounter.lastTime = time;
                        fpsCounter.frames = 0;
                    }
                }

                const delta = clock.getDelta();
                if (mixer) {
                    mixer.update(delta);
                }
                handleControllerInput(delta);

                if (resizeRendererToDisplaySize(renderer)) {
                    const canvas = renderer.domElement;
                    camera.aspect = canvas.clientWidth / canvas.clientHeight;
                    camera.updateProjectionMatrix();
                }
                renderer.render(scene, camera);
            }

            renderer.setAnimationLoop(render);

            // Collapsible sections logic
            document.querySelectorAll('.collapsible-header').forEach(header => {
                header.addEventListener('click', () => {
                    const container = header.closest('.collapsible-container');
                    container.classList.toggle('collapsed');
                });
            });
        }

        window.populateSampleModels = function(modelList) {
            const listContainer = document.getElementById('sample-models-list');
            listContainer.innerHTML = ''; // Clear previous list
            if (!modelList || modelList.length === 0) {
                listContainer.innerHTML = '<p>No sample models found.</p>';
                return;
            }
            modelList.forEach(modelPath => {
                const button = document.createElement('button');
                const filename = modelPath.split('/').pop();
                button.textContent = filename;
                button.title = filename; // Use the full filename as the tooltip.
                button.dataset.path = modelPath;
                listContainer.appendChild(button);
            });
        }

        fetch('get_models.php', { cache: 'no-store' })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(populateSampleModels)
            .catch(error => {
                console.error('Error fetching sample models:', error);
                document.getElementById('sample-models-header').textContent = 'Offline';
                populateSampleModels(null);
            });

        window.addEventListener('DOMContentLoaded', main);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Service Worker registered with scope:', registration.scope);
                    })
                    .catch(error => {
                        console.error('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
