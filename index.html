<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLTF Viewer</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #c { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        #side-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 250px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            transition: transform 0.3s ease;
            transform: translateX(-250px); /* Start hidden */
            height: 100%;
            z-index: 2;
            padding: 20px;
            box-sizing: border-box;
        }

        #side-panel.visible {
            transform: translateX(0);
        }

        #panel-toggle-button {
            position: absolute;
            top: 10px;
            right: -40px; /* Position outside the panel */
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 20px;
            line-height: 30px;
            text-align: center;
            padding: 0;
        }

        #panel-content {
            /* No styles needed here as padding is on parent now */
        }

        #file-input {
            width: 100%;
            margin-bottom: 15px;
        }

        #webxr-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Add some space between the buttons */
        }

        #webxr-buttons button {
            position: static !important; /* Override library's inline absolute positioning */
            width: 100% !important;
            margin: 0 !important;
            display: block;
            background-color: #444;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
        }

        #webxr-buttons button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div id="side-panel" class="visible">
        <button id="panel-toggle-button">☰</button>
        <div id="panel-content">
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button id="browse-button" style="flex-grow: 1; padding: 10px; background-color: #444; color: white; border: 1px solid #555; cursor: pointer; font-size: 14px;">Browse</button>
                <button id="clear-button" style="padding: 10px; background-color: #666; color: white; border: 1px solid #777; cursor: pointer; font-size: 14px;">Clear</button>
            </div>
            <input type="file" id="file-input-fallback" accept=".gltf,.glb,.fbx,.obj,.stl,.jpg,.jpeg,.png" style="display: none;" />
            <div id="webxr-buttons"></div>
            <hr>
            <h4 id="sample-models-header">Sample Models</h4>
            <div id="sample-models-list"></div>
            <hr>
            <h4>Settings</h4>
            <div>
                <input type="checkbox" id="antialias-toggle">
                <label for="antialias-toggle" style="font-size: 14px;">Enable Antialiasing</label>
            </div>
            <div>
                <input type="checkbox" id="fps-toggle">
                <label for="fps-toggle" style="font-size: 14px;">Show FPS</label>
            </div>
            <div>
                <label style="font-size: 14px;">VR Background</label>
                <div id="rgb-sliders" style="display: flex; flex-direction: column; gap: 5px; margin-top: 5px;">
                    R: <input type="range" id="r-slider" min="0" max="255" step="1">
                    G: <input type="range" id="g-slider" min="0" max="255" step="1">
                    B: <input type="range" id="b-slider" min="0" max="255" step="1">
                </div>
            </div>
            <hr>
            <div id="version-info" style="font-size: 12px; color: #888; position: absolute; bottom: 10px;">Version: 1.4.8</div>
        </div>
    </div>
    <div id="fps-counter" style="position: absolute; top: 10px; right: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px; font-family: sans-serif; display: none; z-index: 10;"></div>
    <canvas id="c"></canvas>
    <script type="importmap">
        {
            "imports": {
                "three": "./js/three/build/three.module.js",
                "three/addons/": "./js/three/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';

        function main() {
            const panel = document.getElementById('side-panel');
            const toggleButton = document.getElementById('panel-toggle-button');

            toggleButton.addEventListener('click', () => {
                panel.classList.toggle('visible');
            });

            const canvas = document.querySelector('#c');
            const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
            renderer.xr.enabled = true;

            // Set a reference space type that is compatible with most AR devices.
            renderer.xr.setReferenceSpaceType('local');

            const webxrButtonsContainer = document.getElementById('webxr-buttons');
            webxrButtonsContainer.appendChild(VRButton.createButton(renderer));
            webxrButtonsContainer.appendChild(ARButton.createButton(renderer));

            let originalModelInfo = null;
            renderer.xr.addEventListener('sessionstart', async () => {
                const session = renderer.xr.getSession();
                console.log('XR session started. Mode:', session.environmentBlendMode);

                if (session.environmentBlendMode === 'additive' || session.environmentBlendMode === 'alpha-blend') {
                    scene.background = null;
                }

                const model = scene.getObjectByName('user_model');
                if (model) {
                    // Store original scale and position
                    originalModelInfo = {
                        scale: model.scale.clone(),
                        position: model.position.clone()
                    };

                    // Calculate bounding box and size
                    const box = new THREE.Box3().setFromObject(model);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);

                    // Avoid division by zero if model has no size
                    if (maxDim > 0) {
                        // Target size for VR (e.g., 1.5 meters on its longest side)
                        const targetSize = 1.5;
                        const scaleFactor = targetSize / maxDim;
                        model.scale.set(scaleFactor, scaleFactor, scaleFactor);
                    }

                    // After scaling, get the new bounding box and center
                    const vrBox = new THREE.Box3().setFromObject(model);
                    const vrCenter = vrBox.getCenter(new THREE.Vector3());

                    // Reposition the model to be centered, on the floor, and in front of the user
                    model.position.x -= vrCenter.x;
                    model.position.y -= vrBox.min.y;
                    model.position.z -= vrCenter.z + 2;
                }
            });

            renderer.xr.addEventListener('sessionend', () => {
                console.log('XR session ended.');
                scene.background = new THREE.Color('black');
                const model = scene.getObjectByName('user_model');
                if (model && originalModelInfo) {
                    model.scale.copy(originalModelInfo.scale);
                    model.position.copy(originalModelInfo.position);
                    originalModelInfo = null; // Clear it for the next session

                    // Re-frame the camera for the 2D view
                    const box = new THREE.Box3().setFromObject(model);
                    const boxSize = box.getSize(new THREE.Vector3()).length();
                    const boxCenter = box.getCenter(new THREE.Vector3());
                    frameArea(boxSize * 1.2, boxSize, boxCenter, camera);
                    controls.target.copy(boxCenter);
                    controls.update();
                }

                // Reset camera rig position
                const cameraRig = renderer.xr.getCamera(camera);
                cameraRig.position.set(0, 0, 0);
            });

            const fov = 45;
            const aspect = 2;  // the canvas default
            const near = 0.1;
            const far = 100;
            const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
            camera.position.set(0, 1, 5);

            const controls = new OrbitControls(camera, canvas);
            controls.target.set(0, 1, 0);
            controls.update();

            const scene = new THREE.Scene();

            // VR Controllers Setup
            const controller1 = renderer.xr.getController(0);
            scene.add(controller1);
            const controller2 = renderer.xr.getController(1);
            scene.add(controller2);

            const controllerModelFactory = new XRControllerModelFactory();

            const controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
            scene.add(controllerGrip1);

            const controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
            scene.add(controllerGrip2);

            let gripPressed = [false, false];
            let triggerPressed = [false, false];

            controller1.addEventListener('connected', function ( event ) {
                console.log('Controller 0 Connected.');
                this.gamepad = event.data.gamepad;
            } );
            controller1.addEventListener('selectstart', () => { triggerPressed[0] = true; });
            controller1.addEventListener('selectend', () => { triggerPressed[0] = false; });
            controller1.addEventListener('squeezestart', () => { gripPressed[0] = true; });
            controller1.addEventListener('squeezeend', () => { gripPressed[0] = false; });

            controller2.addEventListener('connected', function ( event ) {
                console.log('Controller 1 Connected.');
                this.gamepad = event.data.gamepad;
            } );
            controller2.addEventListener('selectstart', () => { triggerPressed[1] = true; });
            controller2.addEventListener('selectend', () => { triggerPressed[1] = false; });
            controller2.addEventListener('squeezestart', () => { gripPressed[1] = true; });
            controller2.addEventListener('squeezeend', () => { gripPressed[1] = false; });
            scene.background = new THREE.Color('black');

            {
                const skyColor = 0xB1E1FF;  // light blue
                const groundColor = 0xB97A20;  // brownish orange
                const intensity = 1;
                const light = new THREE.HemisphereLight(skyColor, groundColor, intensity);
                scene.add(light);
            }

            {
                const color = 0xFFFFFF;
                const intensity = 1;
                const light = new THREE.DirectionalLight(color, intensity);
                light.position.set(0, 10, 5);
                light.target.position.set(-5, 0, 0);
                scene.add(light);
                scene.add(light.target);
            }

            const gltfLoader = new GLTFLoader();
            const fbxLoader = new FBXLoader();
            const objLoader = new OBJLoader();
            const stlLoader = new STLLoader();

            function setModel(object) {
                // The object could be a Group from GLTF/FBX/OBJ or a Mesh from STL

                // Ensure the model rotates around its center
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                object.position.sub(center); // Center the model's geometry

                const modelGroup = new THREE.Group();
                modelGroup.name = 'user_model';
                modelGroup.add(object);

                // remove previous model
                const previousModel = scene.getObjectByName('user_model');
                if (previousModel) {
                    scene.remove(previousModel);
                }
                scene.add(modelGroup);

                // center and frame the new model group
                const newBox = new THREE.Box3().setFromObject(modelGroup);
                const boxSize = newBox.getSize(new THREE.Vector3()).length();
                const boxCenter = newBox.getCenter(new THREE.Vector3());

                frameArea(boxSize * 1.2, boxSize, boxCenter, camera);

                controls.maxDistance = boxSize * 10;
                controls.target.copy(boxCenter);
                controls.update();
            }

            const fileInput = document.getElementById('file-input');
            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const filename = file.name.toLowerCase();
                const extension = filename.split('.').pop();
                const reader = new FileReader();

                reader.onload = (e) => {
                    const contents = e.target.result;

                    try {
                        if (extension === 'gltf' || extension === 'glb') {
                            // GLTFLoader is async
                            gltfLoader.parse(contents, '', (gltf) => {
                                setModel(gltf.scene);
                            }, (error) => {
                                alert(`An error occurred parsing the GLTF model: ${error.message}`);
                                console.error(error);
                            });
                        } else {
                            // Other loaders are sync
                            let object;
                            switch (extension) {
                                case 'fbx':
                                    object = fbxLoader.parse(contents);
                                    break;
                                case 'obj':
                                    object = objLoader.parse(contents);
                                    break;
                                case 'stl':
                                    const geometry = stlLoader.parse(contents);
                                    const material = new THREE.MeshStandardMaterial({color: 0xAAAAAA, metalness: 0.1, roughness: 0.75});
                                    object = new THREE.Mesh(geometry, material);
                                    break;
                                default:
                                    alert(`Unsupported file type: .${extension}`);
                                    return;
                            }
                            setModel(object);
                        }
                    } catch (err) {
                        alert(`An error occurred loading the file: ${err.message}`);
                        console.error(err);
                    }
                };

                const binaryExtensions = ['glb', 'stl', 'fbx'];
                if (binaryExtensions.includes(extension)) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file);
                }
            });

            const listContainer = document.getElementById('sample-models-list');
            listContainer.addEventListener('click', (event) => {
                if (event.target.tagName !== 'BUTTON') return;

                const modelPath = event.target.dataset.path;
                if (!modelPath) return;

                const extension = modelPath.split('.').pop().toLowerCase();
                let loader;
                let onLoad;

                switch (extension) {
                    case 'gltf':
                    case 'glb':
                        loader = gltfLoader;
                        onLoad = (gltf) => setModel(gltf.scene);
                        break;
                    case 'fbx':
                        loader = fbxLoader;
                        onLoad = (object) => setModel(object);
                        break;
                    case 'obj':
                        loader = objLoader;
                        onLoad = (object) => setModel(object);
                        break;
                    case 'stl':
                        loader = stlLoader;
                        onLoad = (geometry) => {
                            const material = new THREE.MeshStandardMaterial({color: 0xAAAAAA, metalness: 0.1, roughness: 0.75});
                            const mesh = new THREE.Mesh(geometry, material);
                            setModel(mesh);
                        };
                        break;
                    default:
                        alert(`Unsupported file type for sample model: .${extension}`);
                        return;
                }

                loader.load(modelPath, onLoad, undefined, (error) => {
                    console.error(`An error happened while loading the model ${modelPath}:`, error);
                    alert(`Could not load model ${modelPath}. See console for details.`);
                });
            });

            function frameArea(sizeToFitOnScreen, boxSize, boxCenter, camera) {
              const halfSizeToFitOnScreen = sizeToFitOnScreen * 0.5;
              const halfFovY = THREE.MathUtils.degToRad(camera.fov * .5);
              const distance = halfSizeToFitOnScreen / Math.tan(halfFovY);

              const direction = (new THREE.Vector3())
                  .subVectors(camera.position, boxCenter)
                  .multiply(new THREE.Vector3(1, 0, 1))
                  .normalize();

              camera.position.copy(direction.multiplyScalar(distance).add(boxCenter));
              camera.near = boxSize / 100;
              camera.far = boxSize * 100;
              camera.updateProjectionMatrix();
              camera.lookAt(boxCenter.x, boxCenter.y, boxCenter.z);
            }

            function resizeRendererToDisplaySize(renderer) {
                if (renderer.xr.isPresenting) return false; // Don't resize when in XR

                const canvas = renderer.domElement;
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                const needResize = canvas.width !== width || canvas.height !== height;
                if (needResize) {
                    renderer.setSize(width, height, false);
                }
                return needResize;
            }

            const clock = new THREE.Clock();

            function handleControllerInput(timeDelta) {
                if (renderer.xr.isPresenting) {
                    for (let i = 0; i < 2; i++) {
                        const controller = renderer.xr.getController(i);

                        if (controller && controller.gamepad && controller.gamepad.axes.length >= 4) {
                            const model = scene.getObjectByName('user_model');
                            if (model) {
                                const x = controller.gamepad.axes[2];
                                const z = controller.gamepad.axes[3];
                                const deadzone = 0.2;

                                if (triggerPressed[i]) {
                                    // Trigger: Rotate Y and Move Y
                                    const rotationSpeed = 1.5; // radians per second
                                    const verticalSpeed = 2; // meters per second
                                    if (Math.abs(x) > deadzone) {
                                        model.rotation.y -= x * rotationSpeed * timeDelta;
                                    }
                                    if (Math.abs(z) > deadzone) {
                                        model.position.y -= z * verticalSpeed * timeDelta;
                                    }
                                } else if (gripPressed[i]) {
                                    // Grip: Scale
                                    const scaleSpeed = 0.5;
                                    if (Math.abs(z) > deadzone) {
                                        const scaleFactor = 1.0 - z * scaleSpeed * timeDelta;
                                        model.scale.multiplyScalar(scaleFactor);
                                    }
                                } else {
                                    // No button: Translate X/Z on the floor
                                    const moveSpeed = 2; // meters per second
                                    if (Math.abs(x) > deadzone) {
                                        model.position.x += x * moveSpeed * timeDelta;
                                    }
                                    if (Math.abs(z) > deadzone) {
                                        model.position.z += z * moveSpeed * timeDelta;
                                    }
                                }
                            }

                            // Exit VR button is independent of other controls
                            if (controller.gamepad.buttons.length > 4 && controller.gamepad.buttons[4].pressed) {
                                const session = renderer.xr.getSession();
                                if (session) {
                                    session.end();
                                }
                            }
                        }
                    }
                }
            }

            function render() {
                const delta = clock.getDelta();
                handleControllerInput(delta);

                if (resizeRendererToDisplaySize(renderer)) {
                    const canvas = renderer.domElement;
                    camera.aspect = canvas.clientWidth / canvas.clientHeight;
                    camera.updateProjectionMatrix();
                }
                renderer.render(scene, camera);
            }

            renderer.setAnimationLoop(render);
        }

        window.populateSampleModels = function(modelList) {
            const listContainer = document.getElementById('sample-models-list');
            listContainer.innerHTML = ''; // Clear previous list
            if (!modelList || modelList.length === 0) {
                listContainer.innerHTML = '<p>No sample models found.</p>';
                return;
            }
            modelList.forEach(modelPath => {
                const button = document.createElement('button');
                button.textContent = modelPath.split('/').pop();
                button.dataset.path = modelPath;
                listContainer.appendChild(button);
            });
        }

        fetch('get_models.php')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(populateSampleModels)
            .catch(error => {
                console.error('Error fetching sample models:', error);
                populateSampleModels(null);
            });

        main();
    </script>
</body>
</html>
