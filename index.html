<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLTF Viewer</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #c { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        #side-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 250px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            transition: transform 0.3s ease;
            transform: translateX(-250px); /* Start hidden */
            height: 100%;
            z-index: 2;
            padding: 20px;
            box-sizing: border-box;
        }

        #side-panel.visible {
            transform: translateX(0);
        }

        #panel-toggle-button {
            position: absolute;
            top: 10px;
            right: -40px; /* Position outside the panel */
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 20px;
            line-height: 30px;
            text-align: center;
            padding: 0;
        }

        #panel-content {
            /* No styles needed here as padding is on parent now */
        }

        #file-input {
            width: 100%;
            margin-bottom: 15px;
        }

        #webxr-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Add some space between the buttons */
        }

        #webxr-buttons button {
            position: static !important; /* Override library's inline absolute positioning */
            width: 100% !important;
            margin: 0 !important;
            display: block;
            background-color: #444;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
        }

        #webxr-buttons button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div id="side-panel" class="visible">
        <button id="panel-toggle-button">☰</button>
        <div id="panel-content">
            <input type="file" id="file-input" accept=".gltf,.glb,.fbx,.obj,.stl" />
            <div id="webxr-buttons"></div>
            <hr>
            <h4>View Mode</h4>
            <div id="view-mode-options">
                <label><input type="radio" name="view-mode" value="model" checked> Model</label><br>
                <label><input type="radio" name="view-mode" value="environment"> Environment</label>
            </div>
            <hr>
            <h4>Settings</h4>
            <div>
                <label><input type="checkbox" id="toggle-directional" checked> Headlight</label><br>
                <label><input type="checkbox" id="toggle-spotlight"> Camera Spotlight</label><br>
                <label><input type="checkbox" id="toggle-shadows"> Enable Shadows</label><br>
                <label><input type="checkbox" id="toggle-animations"> Animate Model</label>
            </div>
            <div style="margin-top: 10px;">
                <label>Standing Height: <span id="height-val">1.6</span>m<br>
                    <input type="range" id="slider-height" min="0.1" max="3.0" step="0.1" value="1.6" style="width: 100%;">
                </label>
            </div>
            <div style="margin-top: 10px;">
                <label>Light Brightness: <span id="brightness-val">1.0</span><br>
                    <input type="range" id="slider-brightness" min="0" max="10" step="0.1" value="1" style="width: 100%;">
                </label>
            </div>
            <hr>
            <h4>Sample Models</h4>
            <div id="sample-models-list"></div>
        </div>
    </div>
    <canvas id="c"></canvas>
    <script type="importmap">
        {
            "imports": {
                "three": "./js/three/build/three.module.js",
                "three/addons/": "./js/three/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';

        function main() {
            let viewMode = 'model';
            let standingHeight = 1.6;
            let lightBrightness = 1.0;
            let lat = 0;
            let lon = -90;
            let mixer = null;
            let directionalLight;
            let cameraSpotlight;
            let modelCamera;
            let environmentCamera;
            let cameraRig;
            let activeCamera;
            let controls;
            let renderer;
            let scene;

            const panel = document.getElementById('side-panel');
            const toggleButton = document.getElementById('panel-toggle-button');

            toggleButton.addEventListener('click', () => {
                panel.classList.toggle('visible');
            });

            document.querySelectorAll('input[name="view-mode"]').forEach(radio => {
                radio.addEventListener('change', () => {
                    updateView(true);
                });
            });

            document.getElementById('toggle-directional').addEventListener('change', (e) => {
                directionalLight.visible = e.target.checked;
            });

            document.getElementById('toggle-spotlight').addEventListener('change', (e) => {
                cameraSpotlight.visible = e.target.checked;
            });

            document.getElementById('slider-height').addEventListener('input', (e) => {
                standingHeight = parseFloat(e.target.value);
                document.getElementById('height-val').textContent = standingHeight.toFixed(1);
                if (viewMode === 'environment') {
                    updateView(false);
                }
            });

            document.getElementById('slider-brightness').addEventListener('input', (e) => {
                lightBrightness = parseFloat(e.target.value);
                document.getElementById('brightness-val').textContent = lightBrightness.toFixed(1);
                updateLightBrightness();
            });

            function updateLightBrightness() {
                if (directionalLight) directionalLight.intensity = lightBrightness;
                if (cameraSpotlight) cameraSpotlight.intensity = lightBrightness * 5; // maintain 5x ratio
            }

            document.getElementById('toggle-shadows').addEventListener('change', (e) => {
                const enabled = e.target.checked;
                renderer.shadowMap.enabled = enabled;
                directionalLight.castShadow = enabled;
                cameraSpotlight.castShadow = enabled;

                // Refresh all materials
                scene.traverse((node) => {
                    if (node.isMesh && node.material) {
                        node.material.needsUpdate = true;
                    }
                });
            });

            document.getElementById('toggle-animations').addEventListener('change', (e) => {
                if (mixer) {
                    if (e.target.checked) {
                        mixer.existingAnimations.forEach(clip => mixer.clipAction(clip).play());
                    } else {
                        mixer.stopAllAction();
                    }
                }
            });

            const canvas = document.querySelector('#c');
            renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
            renderer.xr.enabled = true;
            renderer.xr.setReferenceSpaceType('local');
            renderer.shadowMap.enabled = false;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const webxrButtonsContainer = document.getElementById('webxr-buttons');

            function updateEnterExitButtons() {
                const session = renderer.xr.getSession();
                const vrButton = document.getElementById('VRButton');
                const arButton = document.getElementById('ARButton');

                if (!session) {
                    if (vrButton) vrButton.textContent = 'Enter VR';
                    if (arButton) arButton.textContent = 'Enter AR';
                } else {
                    if (vrButton) vrButton.textContent = 'Exit VR/AR';
                    if (arButton) arButton.textContent = 'Exit VR/AR';
                }
            }
            renderer.xr.addEventListener('sessionstart', updateEnterExitButtons);
            renderer.xr.addEventListener('sessionend', updateEnterExitButtons);

            // AR Button
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                        const arButton = document.createElement('button');
                        arButton.id = 'ARButton';
                        arButton.addEventListener('click', () => {
                            const currentSession = renderer.xr.getSession();
                            if (currentSession) {
                                currentSession.end();
                            } else {
                                const sessionInit = {
                                    optionalFeatures: ['hand-tracking', 'dom-overlay', 'hit-test'],
                                    domOverlay: { root: document.body }
                                };
                                navigator.xr.requestSession('immersive-ar', sessionInit).then((session) => {
                                    renderer.xr.setSession(session);
                                });
                            }
                        });
                        webxrButtonsContainer.appendChild(arButton);
                        updateEnterExitButtons();
                    }
                });
            }

            // VR Button
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        const vrButton = document.createElement('button');
                        vrButton.id = 'VRButton';
                        vrButton.addEventListener('click', () => {
                            const currentSession = renderer.xr.getSession();
                            if (currentSession) {
                                currentSession.end();
                            } else {
                                const sessionInit = {
                                    optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
                                };
                                navigator.xr.requestSession('immersive-vr', sessionInit).then((session) => {
                                    renderer.xr.setSession(session);
                                });
                            }
                        });
                        webxrButtonsContainer.appendChild(vrButton);
                        updateEnterExitButtons();
                    }
                });
            }

            let originalModelInfo = null;
            renderer.xr.addEventListener('sessionstart', async () => {
                const session = renderer.xr.getSession();
                console.log('XR session started. Mode:', session.environmentBlendMode);

                controls.enabled = false;

                if (session.environmentBlendMode === 'additive' || session.environmentBlendMode === 'alpha-blend') {
                    scene.background = null;
                }

                const model = scene.getObjectByName('user_model');
                if (model && viewMode === 'model') {
                    // Store original scale and position
                    originalModelInfo = {
                        scale: model.scale.clone(),
                        position: model.position.clone()
                    };

                    // Calculate bounding box and size
                    const box = new THREE.Box3().setFromObject(model);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);

                    // Avoid division by zero if model has no size
                    if (maxDim > 0) {
                        // Target size for VR (e.g., 1.5 meters on its longest side)
                        const targetSize = 1.5;
                        const scaleFactor = targetSize / maxDim;
                        model.scale.set(scaleFactor, scaleFactor, scaleFactor);
                    }

                    // After scaling, get the new bounding box and center
                    const vrBox = new THREE.Box3().setFromObject(model);
                    const vrCenter = vrBox.getCenter(new THREE.Vector3());

                    // Reposition the model to be centered, on the floor, and in front of the user
                    model.position.x -= vrCenter.x;
                    model.position.y -= vrBox.min.y;
                    model.position.z -= vrCenter.z + 2;
                }
            });

            renderer.xr.addEventListener('sessionend', () => {
                console.log('XR session ended.');
                scene.background = new THREE.Color('black');

                if (viewMode === 'model') {
                    controls.enabled = true;
                }

                const model = scene.getObjectByName('user_model');
                if (model && originalModelInfo) {
                    model.scale.copy(originalModelInfo.scale);
                    model.position.copy(originalModelInfo.position);
                    originalModelInfo = null; // Clear it for the next session

                    // Re-frame the camera for the 2D view
                    if (viewMode === 'model') {
                        const box = new THREE.Box3().setFromObject(model);
                        const boxSize = box.getSize(new THREE.Vector3()).length();
                        const boxCenter = box.getCenter(new THREE.Vector3());
                        frameArea(boxSize * 1.2, boxSize, boxCenter, modelCamera);
                        controls.target.copy(boxCenter);
                        controls.update();
                    }
                }

                if (viewMode === 'environment') {
                    updateView(false);
                }

                // Reset camera rig and cameras to clear VR offsets
                cameraRig.position.set(0, 0, 0);
                cameraRig.rotation.set(0, 0, 0);
                modelCamera.position.set(0, 1, 5);
                modelCamera.rotation.set(0, 0, 0);
                environmentCamera.position.set(0, 0, 0);
                environmentCamera.rotation.set(0, 0, 0);

                // Reset internal XR camera offset
                try {
                    const xrCamera = renderer.xr.getCamera(activeCamera);
                    xrCamera.position.set(0, 0, 0);
                } catch (e) {
                    console.warn('Could not reset XR camera position:', e);
                }
            });

            const fov = 45;
            const aspect = 2;  // the canvas default
            const near = 0.1;
            const far = 100;
            modelCamera = new THREE.PerspectiveCamera(fov, aspect, near, far);
            modelCamera.position.set(0, 1, 5);

            environmentCamera = new THREE.PerspectiveCamera(fov, aspect, near, far);
            environmentCamera.name = 'environmentCamera';
            environmentCamera.position.set(0, standingHeight, 0);

            activeCamera = modelCamera;

            cameraSpotlight = new THREE.SpotLight(0xffffff, 5);
            cameraSpotlight.angle = Math.PI / 4;
            cameraSpotlight.penumbra = 0.1;
            cameraSpotlight.decay = 2;
            cameraSpotlight.distance = 200;
            cameraSpotlight.visible = false;

            const spotlightTarget = new THREE.Object3D();
            spotlightTarget.position.set(0, 0, -1);
            // Default target, will be added to active camera in updateView
            cameraSpotlight.target = spotlightTarget;

            controls = new OrbitControls(modelCamera, canvas);
            controls.target.set(0, 1, 0);
            controls.update();

            canvas.addEventListener('pointermove', (e) => {
                if (viewMode === 'environment' && e.buttons === 1) {
                    lon -= e.movementX * 0.1;
                    lat += e.movementY * 0.1;
                    lat = Math.max(-85, Math.min(85, lat));
                }
            });

            scene = new THREE.Scene();
            cameraRig = new THREE.Group();
            scene.add(cameraRig);

            cameraRig.add(modelCamera);
            cameraRig.add(environmentCamera);

            // VR Controllers Setup
            const controller1 = renderer.xr.getController(0);
            cameraRig.add(controller1);
            const controller2 = renderer.xr.getController(1);
            cameraRig.add(controller2);

            const controllerGrip1 = renderer.xr.getControllerGrip(0);
            cameraRig.add(controllerGrip1);

            const controllerGrip2 = renderer.xr.getControllerGrip(1);
            cameraRig.add(controllerGrip2);

            let gripPressed = [false, false];
            let triggerPressed = [false, false];
            let exitButtonPressed = [false, false];
            let animationPauseButtonPressed = [false, false];

            controller1.addEventListener('connected', function ( event ) {
                console.log('Controller 0 Connected.');
                this.gamepad = event.data.gamepad;
            } );
            controller1.addEventListener('selectstart', () => { triggerPressed[0] = true; });
            controller1.addEventListener('selectend', () => { triggerPressed[0] = false; });
            controller1.addEventListener('squeezestart', () => { gripPressed[0] = true; });
            controller1.addEventListener('squeezeend', () => { gripPressed[0] = false; });

            controller2.addEventListener('connected', function ( event ) {
                console.log('Controller 1 Connected.');
                this.gamepad = event.data.gamepad;
            } );
            controller2.addEventListener('selectstart', () => { triggerPressed[1] = true; });
            controller2.addEventListener('selectend', () => { triggerPressed[1] = false; });
            controller2.addEventListener('squeezestart', () => { gripPressed[1] = true; });
            controller2.addEventListener('squeezeend', () => { gripPressed[1] = false; });
            scene.background = new THREE.Color('black');

            {
                const skyColor = 0xB1E1FF;  // light blue
                const groundColor = 0xB97A20;  // brownish orange
                const intensity = 2;
                const light = new THREE.HemisphereLight(skyColor, groundColor, intensity);
                scene.add(light);

                const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
                scene.add(ambientLight);
            }

            {
                const color = 0xFFFFFF;
                const intensity = 1;
                directionalLight = new THREE.DirectionalLight(color, intensity);
                // Positioned relative to camera as a headlight
                directionalLight.position.set(5, 5, 5);
                // directionalLight and target will be added to active camera in updateView
                directionalLight.target.position.set(0, 0, -5);
            }

            const gltfLoader = new GLTFLoader();
            const fbxLoader = new FBXLoader();
            const objLoader = new OBJLoader();
            const stlLoader = new STLLoader();

            function updateView(resetRotation = true) {
                const modelGroup = scene.getObjectByName('user_model');
                viewMode = document.querySelector('input[name="view-mode"]:checked').value;

                if (viewMode === 'model') {
                    activeCamera = modelCamera;
                    controls.enabled = true;
                    if (modelGroup) {
                        const newBox = new THREE.Box3().setFromObject(modelGroup);
                        const boxSize = newBox.getSize(new THREE.Vector3()).length();
                        const boxCenter = newBox.getCenter(new THREE.Vector3());

                        frameArea(boxSize * 1.2, boxSize, boxCenter, modelCamera);

                        controls.maxDistance = boxSize * 10;
                        controls.target.copy(boxCenter);
                    } else {
                        // Default view if no model
                        modelCamera.position.set(0, 1, 5);
                        controls.target.set(0, 1, 0);
                    }
                    controls.update();
                } else {
                    // Environment mode
                    activeCamera = environmentCamera;
                    controls.enabled = false;

                    environmentCamera.position.set(0, 0, 0);
                    cameraRig.position.set(0, 0, 0);
                    cameraRig.rotation.set(0, 0, 0);

                    if (modelGroup) {
                        modelGroup.position.set(0, 0, 0);
                        modelGroup.scale.set(1, 1, 1);
                        modelGroup.rotation.set(0, 0, 0);
                    }

                    if (resetRotation) {
                        lat = 0;
                        lon = -90;
                    }

                    // Initial lookAt
                    const phi = THREE.MathUtils.degToRad(90 - lat);
                    const theta = THREE.MathUtils.degToRad(lon);
                    const target = new THREE.Vector3(
                        environmentCamera.position.x + Math.sin(phi) * Math.cos(theta),
                        environmentCamera.position.y + Math.cos(phi),
                        environmentCamera.position.z + Math.sin(phi) * Math.sin(theta)
                    );
                    environmentCamera.lookAt(target);
                }

                // Parent lights to active camera
                activeCamera.add(directionalLight);
                activeCamera.add(directionalLight.target);
                activeCamera.add(cameraSpotlight);
                activeCamera.add(cameraSpotlight.target);
            }

            function setModel(object, animations = []) {
                // The object could be a Group from GLTF/FBX/OBJ or a Mesh from STL

                // Configure shadows
                object.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });

                // Handle animations
                if (mixer) {
                    mixer.stopAllAction();
                    mixer.uncacheRoot(mixer._root);
                }

                if (animations && animations.length > 0) {
                    mixer = new THREE.AnimationMixer(object);
                    mixer.existingAnimations = animations;
                    if (document.getElementById('toggle-animations').checked) {
                        animations.forEach(clip => mixer.clipAction(clip).play());
                    }
                } else {
                    mixer = null;
                }

                const modelGroup = new THREE.Group();
                modelGroup.name = 'user_model';
                modelGroup.add(object);

                // remove previous model
                const previousModel = scene.getObjectByName('user_model');
                if (previousModel) {
                    scene.remove(previousModel);
                }
                scene.add(modelGroup);

                updateView();
            }

            const fileInput = document.getElementById('file-input');
            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const filename = file.name.toLowerCase();
                const extension = filename.split('.').pop();
                const reader = new FileReader();

                reader.onload = (e) => {
                    const contents = e.target.result;

                    try {
                        if (extension === 'gltf' || extension === 'glb') {
                            // GLTFLoader is async
                            gltfLoader.parse(contents, '', (gltf) => {
                                setModel(gltf.scene, gltf.animations);
                            }, (error) => {
                                alert(`An error occurred parsing the GLTF model: ${error.message}`);
                                console.error(error);
                            });
                        } else {
                            // Other loaders are sync
                            let object;
                            switch (extension) {
                                case 'fbx':
                                    object = fbxLoader.parse(contents);
                                    // FBXLoader.parse returns the group which has animations attached in some versions,
                                    // but usually we get them from the object.animations
                                    setModel(object, object.animations);
                                    return;
                                case 'obj':
                                    object = objLoader.parse(contents);
                                    break;
                                case 'stl':
                                    const geometry = stlLoader.parse(contents);
                                    const material = new THREE.MeshStandardMaterial({color: 0xAAAAAA, metalness: 0.1, roughness: 0.75});
                                    object = new THREE.Mesh(geometry, material);
                                    break;
                                default:
                                    alert(`Unsupported file type: .${extension}`);
                                    return;
                            }
                            setModel(object);
                        }
                    } catch (err) {
                        alert(`An error occurred loading the file: ${err.message}`);
                        console.error(err);
                    }
                };

                const binaryExtensions = ['glb', 'stl', 'fbx'];
                if (binaryExtensions.includes(extension)) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file);
                }
            });

            const listContainer = document.getElementById('sample-models-list');
            listContainer.addEventListener('click', (event) => {
                if (event.target.tagName !== 'BUTTON') return;

                const modelPath = event.target.dataset.path;
                if (!modelPath) return;

                const extension = modelPath.split('.').pop().toLowerCase();
                let loader;
                let onLoad;

                switch (extension) {
                    case 'gltf':
                    case 'glb':
                        loader = gltfLoader;
                        onLoad = (gltf) => setModel(gltf.scene, gltf.animations);
                        break;
                    case 'fbx':
                        loader = fbxLoader;
                        onLoad = (object) => setModel(object, object.animations);
                        break;
                    case 'obj':
                        loader = objLoader;
                        onLoad = (object) => setModel(object);
                        break;
                    case 'stl':
                        loader = stlLoader;
                        onLoad = (geometry) => {
                            const material = new THREE.MeshStandardMaterial({color: 0xAAAAAA, metalness: 0.1, roughness: 0.75});
                            const mesh = new THREE.Mesh(geometry, material);
                            setModel(mesh);
                        };
                        break;
                    default:
                        alert(`Unsupported file type for sample model: .${extension}`);
                        return;
                }

                loader.load(modelPath, onLoad, undefined, (error) => {
                    console.error(`An error happened while loading the model ${modelPath}:`, error);
                    alert(`Could not load model ${modelPath}. See console for details.`);
                });
            });

            function frameArea(sizeToFitOnScreen, boxSize, boxCenter, camera) {
              const halfSizeToFitOnScreen = sizeToFitOnScreen * 0.5;
              const halfFovY = THREE.MathUtils.degToRad(camera.fov * .5);
              const distance = halfSizeToFitOnScreen / Math.tan(halfFovY);

              const direction = (new THREE.Vector3())
                  .subVectors(camera.position, boxCenter)
                  .multiply(new THREE.Vector3(1, 0, 1));

              if (direction.lengthSq() === 0) {
                  direction.set(0, 0, 1);
              } else {
                  direction.normalize();
              }

              camera.position.copy(direction.multiplyScalar(distance).add(boxCenter));
              camera.near = boxSize / 100;
              camera.far = boxSize * 100;
              camera.updateProjectionMatrix();
              camera.lookAt(boxCenter.x, boxCenter.y, boxCenter.z);
            }

            function resizeRendererToDisplaySize(renderer) {
                if (renderer.xr.isPresenting) return false; // Don't resize when in XR

                const canvas = renderer.domElement;
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                const needResize = canvas.width !== width || canvas.height !== height;
                if (needResize) {
                    renderer.setSize(width, height, false);
                }
                return needResize;
            }

            const clock = new THREE.Clock();

            function handleControllerInput(timeDelta) {
                if (!renderer.xr.isPresenting) return;

                for (let i = 0; i < 2; i++) {
                    const controller = renderer.xr.getController(i);
                    if (!controller || !controller.gamepad || controller.gamepad.axes.length < 4) continue;

                    const x = controller.gamepad.axes[2];
                    const z = controller.gamepad.axes[3];
                    const deadzone = 0.2;

                    // Exit VR button (independent) - A/X Button (standard index 4)
                    if (controller.gamepad.buttons.length > 4 && controller.gamepad.buttons[4].pressed) {
                        if (!exitButtonPressed[i]) {
                            exitButtonPressed[i] = true;
                            const vrButton = document.getElementById('VRButton');
                            const arButton = document.getElementById('ARButton');
                            if (vrButton && vrButton.textContent.includes('Exit')) {
                                vrButton.click();
                            } else if (arButton && arButton.textContent.includes('Exit')) {
                                arButton.click();
                            }
                        }
                    } else {
                        exitButtonPressed[i] = false;
                    }

                    // Animation toggle - B/Y Button (standard index 5)
                    if (controller.gamepad.buttons.length > 5 && controller.gamepad.buttons[5].pressed) {
                        if (!animationPauseButtonPressed[i] && mixer) {
                            animationPauseButtonPressed[i] = true;
                            mixer.timeScale = mixer.timeScale === 0 ? 1 : 0;
                        }
                    } else {
                        animationPauseButtonPressed[i] = false;
                    }

                    if (viewMode === 'environment') {
                        // Environment Mode: Locomotion
                        if (Math.abs(x) > deadzone || Math.abs(z) > deadzone) {
                            const isLeft = (controller.gamepad.hand === 'left') || (i === 0 && !controller.gamepad.hand);
                            const isRight = (controller.gamepad.hand === 'right') || (i === 1 && !controller.gamepad.hand);

                            if (isLeft) {
                                // Walk: Move rig relative to camera orientation on XZ plane
                                const moveSpeed = 2.0;
                                const worldQuaternion = new THREE.Quaternion();
                                activeCamera.getWorldQuaternion(worldQuaternion);

                                const forward = new THREE.Vector3(0, 0, -1);
                                forward.applyQuaternion(worldQuaternion);
                                forward.y = 0;
                                if (forward.lengthSq() > 0) {
                                    forward.normalize();
                                    cameraRig.position.addScaledVector(forward, -z * moveSpeed * timeDelta);
                                }

                                const right = new THREE.Vector3(1, 0, 0);
                                right.applyQuaternion(worldQuaternion);
                                right.y = 0;
                                if (right.lengthSq() > 0) {
                                    right.normalize();
                                    cameraRig.position.addScaledVector(right, x * moveSpeed * timeDelta);
                                }
                            } else if (isRight) {
                                // Rotate view (yaw)
                                const rotateSpeed = 1.5;
                                cameraRig.rotation.y -= x * rotateSpeed * timeDelta;
                            }
                        }
                    } else {
                        // Model Mode: Model Interaction
                        const model = scene.getObjectByName('user_model');
                        if (model && (Math.abs(x) > deadzone || Math.abs(z) > deadzone)) {
                            if (triggerPressed[i]) {
                                // Trigger: Rotate Y and Move Y
                                const rotationSpeed = 1.5;
                                const verticalSpeed = 2.0;
                                if (Math.abs(x) > deadzone) model.rotation.y -= x * rotationSpeed * timeDelta;
                                if (Math.abs(z) > deadzone) model.position.y -= z * verticalSpeed * timeDelta;
                            } else if (gripPressed[i]) {
                                // Grip: Scale
                                const scaleSpeed = 0.5;
                                if (Math.abs(z) > deadzone) {
                                    const scaleFactor = 1.0 - z * scaleSpeed * timeDelta;
                                    model.scale.multiplyScalar(scaleFactor);
                                }
                            } else {
                                // No button: Translate X/Z on the floor
                                const moveSpeed = 2.0;
                                if (Math.abs(x) > deadzone) model.position.x += x * moveSpeed * timeDelta;
                                if (Math.abs(z) > deadzone) model.position.z += z * moveSpeed * timeDelta;
                            }
                        }
                    }

                }
            }

            function render(time, frame) {
                const delta = clock.getDelta();
                handleControllerInput(delta);

                if (mixer) {
                    mixer.update(delta);
                }

                if (resizeRendererToDisplaySize(renderer)) {
                    const canvas = renderer.domElement;
                    modelCamera.aspect = canvas.clientWidth / canvas.clientHeight;
                    modelCamera.updateProjectionMatrix();
                    environmentCamera.aspect = canvas.clientWidth / canvas.clientHeight;
                    environmentCamera.updateProjectionMatrix();
                }

                if (viewMode === 'environment' && !renderer.xr.isPresenting) {
                    const phi = THREE.MathUtils.degToRad(90 - lat);
                    const theta = THREE.MathUtils.degToRad(lon);
                    const target = new THREE.Vector3(
                        environmentCamera.position.x + Math.sin(phi) * Math.cos(theta),
                        environmentCamera.position.y + Math.cos(phi),
                        environmentCamera.position.z + Math.sin(phi) * Math.sin(theta)
                    );
                    environmentCamera.lookAt(target);
                }

                try {
                    renderer.render(scene, activeCamera);
                } catch (e) {
                    if (e.name === 'InvalidStateError') {
                        console.warn('Caught InvalidStateError - session likely ended during render');
                    } else {
                        throw e;
                    }
                }
            }

            // Initial state from DOM
            directionalLight.visible = document.getElementById('toggle-directional').checked;
            cameraSpotlight.visible = document.getElementById('toggle-spotlight').checked;

            standingHeight = parseFloat(document.getElementById('slider-height').value);
            document.getElementById('height-val').textContent = standingHeight.toFixed(1);

            lightBrightness = parseFloat(document.getElementById('slider-brightness').value);
            document.getElementById('brightness-val').textContent = lightBrightness.toFixed(1);
            updateLightBrightness();

            const shadowEnabled = document.getElementById('toggle-shadows').checked;
            renderer.shadowMap.enabled = shadowEnabled;
            directionalLight.castShadow = shadowEnabled;
            cameraSpotlight.castShadow = shadowEnabled;

            updateView(true);

            // Expose for debugging/testing
            window.THREE = THREE;
            window.modelCamera = modelCamera;
            window.environmentCamera = environmentCamera;
            window.cameraRig = cameraRig;
            window.activeCamera = () => activeCamera;
            window.scene = scene;
            window.controls = controls;
            window.directionalLight = directionalLight;
            window.cameraSpotlight = cameraSpotlight;
            window.standingHeight = () => standingHeight;
            window.lightBrightness = () => lightBrightness;
            window.setModel = setModel;

            renderer.setAnimationLoop(render);
        }

        window.populateSampleModels = function(modelList) {
            const listContainer = document.getElementById('sample-models-list');
            listContainer.innerHTML = ''; // Clear previous list
            if (!modelList || modelList.length === 0) {
                listContainer.innerHTML = '<p>No sample models found.</p>';
                return;
            }
            modelList.forEach(modelPath => {
                const button = document.createElement('button');
                button.textContent = modelPath.split('/').pop();
                button.dataset.path = modelPath;
                listContainer.appendChild(button);
            });
        }

        fetch('get_models.php')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(populateSampleModels)
            .catch(error => {
                console.error('Error fetching sample models:', error);
                populateSampleModels(null);
            });

        main();
    </script>
</body>
</html>
